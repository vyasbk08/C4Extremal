name = "C4Extremal"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["C4Extremal"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# The header linter enforces Mathlib's copyright-header format, which is
# only meant for files contributed to Mathlib itself — not for this project.
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "C4Extremal"
